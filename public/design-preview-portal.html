<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>معاينة تصميم اختيار القسم | جودة الانطلاقة</title>
  <link rel="stylesheet" href="lq-arabic-type.css?v=day1">
  <link rel="stylesheet" href="lq-exec-theme.css?v=day1">
  <link rel="stylesheet" href="lq-official-atmosphere.css?v=day2">
  <link rel="stylesheet" href="lq-brand-mark.css?v=day2">
  <link rel="stylesheet" href="lq-official-portal.css?v=day2">
</head>
<body class="lq-exec lq-official-portal show-finance">
  <div class="op-bg lq-atm-bg" aria-hidden="true"></div>
  <main class="op-stage">
    <div class="op-top"><span class="lq-lang-switch">معاينة تصميم · لا تحتاج دخول</span></div>
    <header class="op-brand">
      <div class="lq-brand-mark lq-brand-mark--lg">
        <img src="/assets/brand-mark-gold.png?v=day1" alt="جودة الانطلاقة">
      </div>
      <h1 class="op-brand-name">Launch Quality</h1>
      <p class="op-brand-ar">جودة الانطلاقة</p>
      <p class="op-support">منصة رسمية لإدارة العقارات والضيافة — اختر مسار عملك</p>
      <hr class="op-rule">
    </header>
    <section class="op-choices" aria-label="أقسام العمل">
      <button class="op-choice" type="button"><div class="op-mark"><img src="/quick-estate/assets/logo_real_estate_transparent.png?v=nizwa3" alt=""></div><h2>عقارات نزوى</h2><p>وحدات وعقود نزوى — منصة مستقلة بعد الدخول</p><span class="op-enter">دخول</span></button>
      <button class="op-choice" type="button"><div class="op-mark op-mark-photo"><img src="/assets/login-portal-bg.png" alt=""></div><h2>العقارات</h2><p>الوحدات، العملاء، العقود، الفواتير، والصيانة</p><span class="op-enter">دخول</span></button>
      <button class="op-choice" type="button"><div class="op-mark"><span>ض</span></div><h2>الضيافة</h2><p>المجالس، الحجوزات، الخدمات، والمخزن</p><span class="op-enter">دخول</span></button>
      <button class="op-choice" type="button"><div class="op-mark"><span>م</span></div><h2>منتجاتنا</h2><p>المنتجات، الأسعار، المخزون، والمبيعات</p><span class="op-enter">دخول</span></button>
      <button class="op-choice" type="button"><div class="op-mark"><span>ن</span></div><h2>نظرة شاملة</h2><p>مؤشرات العقارات والضيافة للإدارة</p><span class="op-enter">دخول</span></button>
      <button class="op-choice finance-only" type="button"><div class="op-mark"><span>ح</span></div><h2>المحاسبة</h2><p>الفواتير، التحصيل، القيود، والتقارير المالية</p><span class="op-enter">دخول</span></button>
    </section>
    <footer class="op-foot">Launch Quality LLC · مشاريع جودة الانطلاقة للخدمات</footer>
  </main>
</body>
</html>
