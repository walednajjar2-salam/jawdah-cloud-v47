<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>دخول | نجار &amp; سموم 2026</title>
  <link rel="icon" href="/assets/app-icon-192.png">
  <link rel="stylesheet" href="/auto-trading/auto-trading.css?v=at42">
</head>
<body class="nt-login">
  <div class="nt-watermark" aria-hidden="true"></div>
  <div class="nt-lux-bg" aria-hidden="true"></div>
  <main class="nt-login-stage">
    <section class="nt-login-brand">
      <div id="loginBrandWrap"></div>
      <p class="nt-login-loc">محافظة الداخلية — ولاية نزوى</p>
    </section>
    <section class="nt-login-card">
      <h2>تسجيل الدخول</h2>
      <p class="nt-login-hint">بعد الدخول تنتقل إلى صفحة المنصات حسب الدول</p>
      <label class="nt-field">
        <span>اسم المستخدم</span>
        <input id="loginUser" autocomplete="username" placeholder="مثال: waleed.najjar">
      </label>
      <label class="nt-field">
        <span>كلمة المرور</span>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
      </label>
      <button class="nt-btn primary" type="button" id="loginBtn">دخول → المنصات</button>
      <p id="loginErr" class="nt-err" hidden></p>
      <div class="nt-login-links">
        <a href="/najjar/customer.html">بوابة الزبائن</a>
        <a href="/najjar/platforms.html">المنصات</a>
      </div>
      <div class="nt-team-credits">
        <div class="nt-team-row">
          <span class="nt-team-label">Owners</span>
          <span class="nt-team-names">Walid Najjar &amp; Hamad Al Samoom</span>
        </div>
      </div>
    </section>
  </main>
  <script src="/auto-trading/car-3d.js?v=at16"></script>
  <script>
    document.getElementById('loginBrandWrap').innerHTML = NajjarCar3D.renderGlassLogo({ size: 'login' });

    async function doLogin() {
      const err = document.getElementById('loginErr');
      err.hidden = true;
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      if (!username || !password) {
        err.textContent = 'أدخل اسم المستخدم وكلمة المرور';
        err.hidden = false;
        return;
      }
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) throw new Error(data.error || 'فشل تسجيل الدخول');
        const token = data.token || data.access_token || '';
        if (!token) throw new Error('لم يُرجع الخادم رمز الدخول');
        localStorage.setItem('jawdah_cloud_token', token);
        localStorage.setItem('jawdah_portal_choice', 'autotrading');
        location.replace('/najjar/platforms.html?from=login&token=' + encodeURIComponent(token));
      } catch (e) {
        err.textContent = e.message || 'تعذر الدخول';
        err.hidden = false;
      } finally {
        btn.disabled = false;
      }
    }
    document.getElementById('loginBtn').onclick = doLogin;
    document.getElementById('loginPass').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') doLogin();
    });
    document.getElementById('loginUser').addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') document.getElementById('loginPass').focus();
    });
    (async () => {
      let saved = (localStorage.getItem('jawdah_cloud_token') || '').trim();
      if (!saved) {
        try {
          const m = document.cookie.match(/(?:^|;\s*)lq_token=([^;]+)/);
          saved = m ? decodeURIComponent(m[1]).trim() : '';
          if (saved) localStorage.setItem('jawdah_cloud_token', saved);
        } catch (_) {/* ignore */}
      }
      if (!saved) return;
      try {
        const res = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + saved } });
        if (res.ok) {
          location.replace('/najjar/platforms.html');
          return;
        }
      } catch (_) {
        return;
      }
      localStorage.removeItem('jawdah_cloud_token');
    })();
  </script>
</body>
</html>
