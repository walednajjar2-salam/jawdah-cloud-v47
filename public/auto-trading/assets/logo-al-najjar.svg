<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-label="NAJJAR TRADING">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e0f18"/>
      <stop offset="45%" stop-color="#e11d2e"/>
      <stop offset="100%" stop-color="#7a0f16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="280" rx="8" fill="#0a0a0a"/>
  <rect x="6" y="6" width="468" height="268" rx="4" fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
  <!-- speed lines -->
  <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity=".95">
    <line x1="58" y1="72" x2="88" y2="72"/>
    <line x1="48" y1="84" x2="86" y2="84"/>
    <line x1="54" y1="96" x2="84" y2="96"/>
  </g>
  <!-- sports car silhouette -->
  <path fill="none" stroke="url(#gold)" stroke-width="3.2" stroke-linejoin="round" filter="url(#glow)"
    d="M98 98c18-8 34-10 52-8 14 2 28 8 38 16 8 6 14 14 18 24 2 5 2 10 0 14-4 8-12 12-22 12H112c-8 0-14-6-14-14v-8c0-12 0-24 0-36z"/>
  <circle cx="128" cy="118" r="7" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="168" cy="118" r="7" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <path fill="none" stroke="url(#gold)" stroke-width="2.5" d="M118 92h36l8 10"/>
  <!-- title -->
  <text x="240" y="118" text-anchor="middle" fill="url(#gold)" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" letter-spacing="3" filter="url(#glow)">NAJJAR TRADING</text>
  <text x="240" y="148" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2.5" opacity=".95">— USED &amp; IMPORTED CARS —</text>
  <!-- whatsapp row -->
  <g font-family="Arial,sans-serif" font-size="13" fill="url(#gold)" font-weight="700">
    <text x="150" y="188" text-anchor="middle">+968 71924089</text>
    <line x1="240" y1="176" x2="240" y2="196" stroke="url(#gold)" stroke-width="1.5" opacity=".6"/>
    <text x="330" y="188" text-anchor="middle">+968 93391994</text>
  </g>
  <!-- location -->
  <circle cx="118" cy="218" r="5" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
  <path fill="url(#gold)" d="M118 226c4-6 8-10 8-14a8 8 0 1 0-16 0c0 4 4 8 8 14z"/>
  <text x="240" y="222" text-anchor="middle" fill="url(#gold)" font-family="Arial,sans-serif" font-size="12" letter-spacing=".5">Al-Dakhilia Governorate · Nizwa · Falaj</text>
</svg>
