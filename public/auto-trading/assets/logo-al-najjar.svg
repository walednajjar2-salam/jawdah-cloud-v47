        d="M30,71 L40,71 A17,16 0 0 1 74,71 L166,71 A17,16 0 0 1 200,71 L211,71
           C217,71 221,68.5 221,65 C221,60.5 217,56 210,52.5 C204,49.6 199,45 193,38.5
           C185,29.5 174,21 160,16.5 C147,12.6 133,11 119,11.5 C104,12 90,15.7 78,22
           C66,28.2 56,36.5 47,46 C41,52.3 34,57.5 27,60 C22,61.8 19,64.3 19,67.2
           C19,69.3 24,71 30,71 Z"/>
      <path fill="#0a0a0a"
