<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-label="NAJJAR &amp; AL SAMOOM TRADING">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6a1c"/>
      <stop offset="45%" stop-color="#e3c46a"/>
      <stop offset="100%" stop-color="#8a6a1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="560" height="340" rx="10" fill="#0a0a0a"/>
  <rect x="6" y="6" width="548" height="328" rx="6" fill="none" stroke="url(#gold)" stroke-width="3" filter="url(#glow)"/>
  <!-- speed lines + modern low sports-car silhouette, nudged up for breathing room above the title -->
  <g transform="translate(0,-18)">
    <g stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity=".8">
      <line x1="150" y1="70" x2="180" y2="70"/>
      <line x1="140" y1="82" x2="178" y2="82"/>
      <line x1="146" y1="94" x2="176" y2="94"/>
    </g>
    <g transform="translate(220,94) scale(0.5)" filter="url(#glow)">
