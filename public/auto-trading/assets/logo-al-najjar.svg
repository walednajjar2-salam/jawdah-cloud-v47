  <g font-family="Arial,sans-serif" fill="url(#gold)">
    <text x="170" y="240" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5">WALED</text>
    <text x="170" y="260" text-anchor="middle" font-size="13" font-weight="700">+968 71924089</text>
    <line x1="280" y1="228" x2="280" y2="266" stroke="url(#gold)" stroke-width="1.5" opacity=".5"/>
    <text x="390" y="240" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1.5">HAMAD</text>
    <text x="390" y="260" text-anchor="middle" font-size="13" font-weight="700">+968 7754 8482</text>
  </g>
  <line x1="60" y1="278" x2="500" y2="278" stroke="url(#gold)" stroke-width="1" opacity=".3"/>
  <!-- sales row -->
  <g font-family="Arial,sans-serif" fill="url(#gold)">
    <text x="280" y="296" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="2">SALES</text>
    <text x="205" y="314" text-anchor="middle" font-size="12" font-weight="700">+968 93391994</text>
    <line x1="280" y1="303" x2="280" y2="319" stroke="url(#gold)" stroke-width="1.2" opacity=".5"/>
    <text x="355" y="314" text-anchor="middle" font-size="12" font-weight="700">+968 9555 1994</text>
