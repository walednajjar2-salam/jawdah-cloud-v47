      <line x1="122" y1="16" x2="115" y2="42.5" stroke="#0a0a0a" stroke-width="2.4"/>
      <path fill="url(#gold)" d="M191,38 L203,33 L206,37 L196,44 Z"/>
      <path fill="url(#gold)" d="M197,44 L207,40 L207,45 L199,48 Z"/>
      <circle cx="55" cy="72" r="16" fill="#0a0a0a" stroke="url(#gold)" stroke-width="3.4"/>
      <circle cx="55" cy="72" r="6.5" fill="url(#gold)"/>
      <circle cx="185" cy="72" r="16" fill="#0a0a0a" stroke="url(#gold)" stroke-width="3.4"/>
      <circle cx="185" cy="72" r="6.5" fill="url(#gold)"/>
