<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>معرض السيارات | NAJJAR &amp; AL SAMOOM TRADING</title>
  <link rel="icon" href="/assets/app-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auto-trading/auto-trading.css?v=at25">
  <link rel="stylesheet" href="/auto-trading/car-3d.css?v=at12">
</head>
<body class="nt-customer">
  <div class="nt-watermark" aria-hidden="true"></div>
  <header class="nt-cust-hero">
    <img src="/auto-trading/assets/logo-official-clear.png?v=at13" alt="NAJAR & AL SAMOOM TRADING" class="nt-cust-mark nt-cust-mark--official">
    <div>
      <h1>معرض السيارات</h1>
      <p class="nt-sub">صور · أسعار · مواصفات · واتساب مباشر</p>
    </div>
    <div class="nt-hub-actions">
      <a class="nt-btn primary" href="https://wa.me/96871924089" target="_blank" rel="noopener">واتساب المعرض</a>
      <a class="nt-btn ghost" href="/auto-trading/login.html">دخول الموظفين</a>
    </div>
  </header>

  <main class="nt-cust-main">
    <div id="custRoot" aria-live="polite">جاري تحميل سيارات المعرض…</div>
  </main>

  <footer class="nt-hub-foot">
    واتساب +968 71924089 · +968 93391994 · حمد +968 77548482 · مكتب 95551994<br>
    بنك صحار الدولي · IBAN OM070300000234020022484 · NAJJAR &amp; AL SAMOOM TRADING — نزوى الفلج
  </footer>

  <script src="/auto-trading/car-3d.js?v=at13"></script>
  <script>
    const root = document.getElementById('custRoot');
    let vehicles = [];
    let filter = 'all';
    let sort = 'showroom';

    function paint() {
      root.innerHTML = NajjarCar3D.renderShowroom(vehicles, { filter, sort, hero: true, whatsapp: true });
      NajjarCar3D.bindShowroom(root, vehicles, {
        onFilter: (id) => {
          filter = id || 'all';
          paint();
          root.querySelector('[data-showroom]')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
        onSort: (id) => {
          sort = id || 'showroom';
          paint();
        },
      });
    }

    (async () => {
      try {
        const data = await fetch('/api/auto-trading/showroom', { cache: 'no-store' }).then((r) => r.json());
        if (!data || data.ok === false) throw new Error(data && data.error);
        vehicles = (data.vehicles || []).map((v, i) => ({ ...v, id: v.id != null ? v.id : i + 1 }));
        if (!vehicles.length) {
          root.innerHTML = '<p class="empty-state">لا توجد سيارات معروضة حالياً — تواصل معنا عبر واتساب</p>';
          return;
        }
        paint();
      } catch (_) {
        root.innerHTML = '<p class="empty-state">تعذر تحميل سيارات المعرض</p>';
      }
    })();
  </script>
</body>
</html>
