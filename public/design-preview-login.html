<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>معاينة تصميم الدخول | جودة الانطلاقة</title>
  <link rel="stylesheet" href="lq-brand-mark.css?v=beauty1">
  <link rel="stylesheet" href="lq-login-locked.css?v=official-login4">
  <style>
    body{margin:0}
    .preview-note{
      position:fixed;top:10px;inset-inline-start:10px;z-index:30;
      background:rgba(11,26,40,.72);color:#f3efe6;border:1px solid rgba(201,169,110,.4);
      border-radius:10px;padding:8px 12px;font:700 12px Cairo,Tajawal,sans-serif;
    }
  </style>
</head>
<body class="login-ultra saas-login lq-exec">
  <div class="preview-note">معاينة تصميم الدخول · لا تحتاج بيانات</div>
  <main id="loginScreen" class="login">
    <div class="login-cinema-photo-layer" aria-hidden="true"></div>
    <div class="login-shell">
      <div class="login-top-logo">
        <div class="lq-brand-mark lq-brand-mark--lg login-logo-wrap login-logo-wrap--float">
          <img src="assets/brand-mark-gold.png?v=beauty1" alt="مشاريع جودة الانطلاقة" class="login-logo-img login-logo-img--float" width="655" height="411">
        </div>
        <div class="login-brand-copy">
          <h1 class="login-brand-name">Launch Quality</h1>
          <p class="login-brand-ar">جودة الانطلاقة</p>
          <p class="login-brand-support">منصة رسمية لإدارة العقارات والضيافة</p>
          <hr class="login-brand-rule">
        </div>
      </div>
      <div class="login-stage login-stage--center">
        <div class="login-glass-stage">
          <div class="login-auth login-auth--float">
            <section class="login-glass-card ev-auth-card login-card--floating" aria-label="تسجيل الدخول">
              <div class="login-card-head">
                <div>
                  <h2 class="login-card-title">تسجيل الدخول</h2>
                  <p class="login-card-sub">بوابة الموظفين · الحساب المعتمد فقط</p>
                </div>
              </div>
              <div class="ev-auth-pane login-form">
                <label class="login-field">
                  <span class="login-field-label">اسم المستخدم</span>
                  <input placeholder="اسم المستخدم" autocomplete="username">
                </label>
                <label class="login-field">
                  <span class="login-field-label">كلمة المرور</span>
                  <input placeholder="كلمة المرور" type="password" autocomplete="current-password">
                  <button type="button" class="login-pass-toggle">إظهار</button>
                </label>
                <div class="login-inline-tools">
                  <label class="login-remember-check"><input type="checkbox"> تذكرني على هذا الجهاز</label>
                  <button type="button" class="ghost login-help-btn">الدعم الفني</button>
                </div>
                <button class="gold-btn login-submit" type="button">دخول</button>
                <div class="login-quiet-links">
                  <a href="/get-windows?auto=1">ويندوز</a>
                  <a href="/get-android">أندرويد</a>
                  <a href="/download.html">التحميلات</a>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
