<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رخصة مركبة — سلطنة عُمان</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      background: #e8eef4;
      font-family: "Times New Roman", Georgia, serif;
    }

    h1.page-title {
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 1.1rem;
      color: #555;
      font-weight: 600;
    }

    .cards-row {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── Card base ── */
    .license-card {
      width: 520px;
      border-radius: 14px;
      border: 2px solid #2a2a2a;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* Wavy pattern (front) */
    .license-card--front {
      background-color: #c8e4f0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 5px,
        rgba(100, 160, 200, 0.25) 5px,
        rgba(100, 160, 200, 0.25) 6px
      );
    }

    /* Dotted ruled lines (back) */
    .license-card--back {
      background-color: #c8e4f0;
      min-height: 340px;
    }

    /* ── Header (front) ── */
    .card-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem 0.5rem;
      background: rgba(200, 228, 240, 0.6);
    }

    .header-en {
      text-align: left;
      direction: ltr;
      line-height: 1.35;
    }

    .header-en .line {
      font-size: 0.72rem;
      font-weight: 700;
      color: #1a3b6e;
      letter-spacing: 0.02em;
    }

    .header-en .line--red {
      color: #c4262e;
      margin-top: 2px;
    }

    .header-ar {
      text-align: right;
      direction: rtl;
      line-height: 1.5;
      font-family: "Traditional Arabic", "Arial", sans-serif;
    }

    .header-ar .line {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1a3b6e;
    }

    .header-ar .line--red {
      color: #c4262e;
      margin-top: 2px;
    }

    .header-emblem {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
    }

    /* ── Body (front) ── */
    .card-body {
      position: relative;
      min-height: 220px;
      padding: 1rem 1.25rem 1.5rem;
    }

    .watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    .watermark svg {
      width: 180px;
      height: 180px;
      opacity: 0.18;
    }

    .writing-lines {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 1.65rem;
      padding-top: 0.5rem;
    }

    .writing-line {
      border-bottom: 1px dashed rgba(80, 140, 180, 0.55);
      height: 0;
    }

    /* ── Back card ── */
    .back-inner {
      position: relative;
      min-height: 340px;
      padding: 1rem 1.25rem;
    }

    .ruled-bg {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 31px,
        rgba(80, 140, 180, 0.45) 31px,
        rgba(80, 140, 180, 0.45) 32px
      );
      pointer-events: none;
    }

    .back-watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .back-watermark svg {
      width: 200px;
      height: 200px;
      opacity: 0.22;
    }

    .field-colons {
      position: absolute;
      right: 1.5rem;
      top: 1.2rem;
      bottom: 5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      font-size: 1rem;
      font-weight: 700;
      color: #333;
      direction: rtl;
    }

    .field-label-mortgage {
      position: absolute;
      right: 1.25rem;
      bottom: 6.5rem;
      z-index: 2;
      font-family: "Traditional Arabic", "Arial", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #111;
      direction: rtl;
    }

    .back-footer {
      position: absolute;
      bottom: 0.75rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 1rem;
      z-index: 3;
    }

    .barcode-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
    }

    .barcode {
      display: flex;
      gap: 1px;
      height: 48px;
      align-items: stretch;
    }

    .barcode span {
      display: block;
      background: #111;
      width: 2px;
    }

    .barcode span.w2 { width: 3px; }
    .barcode span.w3 { width: 4px; }
    .barcode span.gap { background: transparent; width: 3px; }

    .serial-number {
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 1rem;
      font-weight: 900;
      color: #111;
      letter-spacing: 0.05em;
    }

    .signature-box {
      background: #fff;
      border: 1.5px solid #7eb8d4;
      border-radius: 4px;
      padding: 0.4rem 0.75rem 0.5rem;
      min-width: 150px;
      text-align: center;
    }

    .signature-box__title {
      font-family: "Traditional Arabic", "Arial", sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 0.25rem;
    }

    .signature-box__sig {
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: 1.4rem;
      color: #111;
      line-height: 1;
      margin: 0.15rem 0;
      transform: rotate(-4deg);
    }

    .signature-box__date {
      font-family: Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: #111;
      margin-top: 0.2rem;
    }

    .card-label {
      text-align: center;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.75rem;
      color: #666;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>

  <h1 class="page-title">نموذج رخصة مركبة — سلطنة عُمان</h1>

  <div class="cards-row">

    <!-- ════════════ FRONT ════════════ -->
    <div>
      <div class="license-card license-card--front">
        <header class="card-header">
          <div class="header-en">
            <div class="line">SULTANATE OF OMAN</div>
            <div class="line">ROYAL OMAN POLICE</div>
            <div class="line">DIR. GENERAL OF TRAFFIC</div>
            <div class="line line--red">MOTOR VEHICLE LICENSE</div>
          </div>

          <div class="header-emblem" aria-hidden="true">
            <!-- Royal Oman Police emblem (simplified SVG) -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="48" fill="none" stroke="#1a3b6e" stroke-width="1.5"/>
              <!-- Crown -->
              <path d="M30 22 L35 14 L42 20 L50 10 L58 20 L65 14 L70 22 L70 28 L30 28 Z" fill="#c4262e" stroke="#1a3b6e" stroke-width="0.8"/>
              <!-- Wreath -->
              <ellipse cx="50" cy="55" rx="32" ry="30" fill="none" stroke="#1a3b6e" stroke-width="2"/>
              <!-- Crossed swords -->
              <line x1="35" y1="65" x2="65" y2="45" stroke="#1a3b6e" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="35" y1="45" x2="65" y2="65" stroke="#1a3b6e" stroke-width="2.5" stroke-linecap="round"/>
              <!-- Khanjar -->
              <path d="M48 38 L52 38 L51 58 L50 62 L49 58 Z" fill="#c4262e" stroke="#1a3b6e" stroke-width="0.6"/>
              <path d="M46 36 L54 36 L52 38 L48 38 Z" fill="#c4262e"/>
              <!-- Banner -->
              <rect x="28" y="72" width="44" height="10" rx="2" fill="#1a3b6e"/>
              <text x="50" y="79.5" text-anchor="middle" fill="#fff" font-size="4.5" font-family="Arial">شرطة عُمان السلطانية</text>
            </svg>
          </div>

          <div class="header-ar">
            <div class="line">سلطنة عُمان</div>
            <div class="line">شرطة عُمان السلطانية</div>
            <div class="line">الإدارة العامة للمرور</div>
            <div class="line line--red">رخصة مركبة</div>
          </div>
        </header>

        <div class="card-body">
          <div class="watermark" aria-hidden="true">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="48" fill="none" stroke="#1a3b6e" stroke-width="1.5"/>
              <path d="M30 22 L35 14 L42 20 L50 10 L58 20 L65 14 L70 22 L70 28 L30 28 Z" fill="#1a3b6e"/>
              <ellipse cx="50" cy="55" rx="32" ry="30" fill="none" stroke="#1a3b6e" stroke-width="2"/>
              <line x1="35" y1="65" x2="65" y2="45" stroke="#1a3b6e" stroke-width="2.5"/>
              <line x1="35" y1="45" x2="65" y2="65" stroke="#1a3b6e" stroke-width="2.5"/>
              <path d="M48 38 L52 38 L51 58 L50 62 L49 58 Z" fill="#1a3b6e"/>
            </svg>
          </div>
          <div class="writing-lines">
            <div class="writing-line"></div>
            <div class="writing-line"></div>
            <div class="writing-line"></div>
            <div class="writing-line"></div>
            <div class="writing-line"></div>
            <div class="writing-line"></div>
            <div class="writing-line"></div>
          </div>
        </div>
      </div>
      <p class="card-label">الوجه الأمامي</p>
    </div>

    <!-- ════════════ BACK ════════════ -->
    <div>
      <div class="license-card license-card--back">
        <div class="back-inner">
          <div class="ruled-bg" aria-hidden="true"></div>

          <div class="back-watermark" aria-hidden="true">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <circle cx="50" cy="50" r="48" fill="none" stroke="#1a3b6e" stroke-width="1.5"/>
              <path d="M30 22 L35 14 L42 20 L50 10 L58 20 L65 14 L70 22 L70 28 L30 28 Z" fill="#1a3b6e"/>
              <ellipse cx="50" cy="55" rx="32" ry="30" fill="none" stroke="#1a3b6e" stroke-width="2"/>
              <line x1="35" y1="65" x2="65" y2="45" stroke="#1a3b6e" stroke-width="2.5"/>
              <line x1="35" y1="45" x2="65" y2="65" stroke="#1a3b6e" stroke-width="2.5"/>
              <path d="M48 38 L52 38 L51 58 L50 62 L49 58 Z" fill="#1a3b6e"/>
              <rect x="28" y="72" width="44" height="10" rx="2" fill="#1a3b6e"/>
              <text x="50" y="79.5" text-anchor="middle" fill="#fff" font-size="4.5" font-family="Arial">شرطة عُمان السلطانية</text>
            </svg>
          </div>

          <div class="field-colons" aria-hidden="true">
            <span>:</span>
            <span>:</span>
            <span>:</span>
            <span>:</span>
            <span>:</span>
            <span>:</span>
            <span>:</span>
            <span>:</span>
          </div>

          <div class="field-label-mortgage">(الرهن (إن وجد :</div>

          <footer class="back-footer">
            <div class="barcode-block">
              <div class="barcode" aria-label="باركود">
                <span class="w2"></span><span></span><span class="w2"></span><span></span><span class="w3"></span>
                <span></span><span class="w2"></span><span></span><span class="gap"></span>
                <span class="w2"></span><span></span><span class="w3"></span><span></span><span class="w2"></span>
                <span></span><span class="w2"></span><span class="gap"></span>
                <span></span><span class="w3"></span><span></span><span class="w2"></span><span></span>
                <span class="w2"></span><span></span><span class="w3"></span><span class="gap"></span>
                <span></span><span class="w2"></span><span></span><span class="w2"></span><span class="w3"></span>
                <span></span><span class="w2"></span><span></span><span class="w2"></span>
              </div>
              <div class="serial-number">4258396</div>
            </div>

            <div class="signature-box">
              <div class="signature-box__title">سلطة الترخيص</div>
              <div class="signature-box__sig">&#x2713;</div>
              <div class="signature-box__date">2026-05-13</div>
            </div>
          </footer>
        </div>
      </div>
      <p class="card-label">الوجه الخلفي</p>
    </div>

  </div>

</body>
</html>
