<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>معاينة جمال الشعار | جودة الانطلاقة</title>
  <link rel="stylesheet" href="lq-brand-mark.css?v=beauty1">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Cormorant+Garamond:wght@700&display=swap");
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
      font-family:Cairo,sans-serif;color:#f3efe6;
      background:
        radial-gradient(ellipse 70% 50% at 50% 30%,rgba(201,169,110,.18),transparent 60%),
        linear-gradient(160deg,#0b1a28,#13293d 55%,#0b1a28);
    }
    .stage{text-align:center;max-width:720px}
    h1{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,5vw,3rem);margin:18px 0 6px;font-weight:700}
    .ar{color:#e2c48a;font-weight:800;margin:0 0 10px;font-size:1.2rem}
    p{color:rgba(243,239,230,.78);line-height:1.7;margin:0 auto;max-width:34rem}
    .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    .card{background:rgba(248,250,252,.06);border:1px solid rgba(201,169,110,.28);border-radius:18px;padding:18px;min-width:220px}
    .card strong{display:block;margin-top:10px;font-size:.85rem;color:#e2c48a}
    .card span{display:block;margin-top:4px;font-size:.78rem;color:rgba(243,239,230,.65)}
  </style>
</head>
<body>
  <main class="stage">
    <div class="lq-brand-mark lq-brand-mark--lg">
      <img src="/assets/brand-mark-gold.png?v=beauty1" alt="جودة الانطلاقة">
    </div>
    <h1>Launch Quality</h1>
    <p class="ar">جودة الانطلاقة</p>
    <p>الشعار يُعرض كعلامة ذهبية شفافة بهالة ناعمة، والنص الأنيق منفصل عنه حتى لا يتكرر الاسم مرتين.</p>
    <div class="row">
      <div class="card">
        <div class="lq-brand-mark lq-brand-mark--md"><img src="/assets/brand-mark-gold.png?v=beauty1" alt=""></div>
        <strong>علامة الواجهة</strong>
        <span>لشاشة الدخول والبوابة</span>
      </div>
      <div class="card">
        <div class="lq-brand-mark lq-brand-mark--sm"><img src="/assets/brand-mark-gold.png?v=beauty1" alt=""></div>
        <strong>حجم صغير</strong>
        <span>للهيدر والتطبيقات</span>
      </div>
    </div>
  </main>
</body>
</html>
