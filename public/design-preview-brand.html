<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>معاينة جمال الشعار | جودة الانطلاقة</title>
  <link rel="stylesheet" href="lq-official-atmosphere.css?v=atm1">
  <link rel="stylesheet" href="lq-brand-mark.css?v=beauty1">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Cormorant+Garamond:wght@700&display=swap");
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
      font-family:Cairo,sans-serif;color:#f3efe6;
      background:#0b1a28;
    }
    .stage{position:relative;z-index:1;text-align:center;max-width:720px}
    h1{font-family:"Cormorant Garamond",serif;font-size:clamp(2rem,5vw,3rem);margin:18px 0 6px;font-weight:700;text-shadow:0 8px 30px rgba(0,0,0,.45)}
    .ar{color:#e2c48a;font-weight:800;margin:0 0 10px;font-size:1.2rem;text-shadow:0 4px 16px rgba(0,0,0,.35)}
    p{color:rgba(255,248,236,.88);line-height:1.7;margin:0 auto;max-width:34rem;text-shadow:0 2px 12px rgba(0,0,0,.45)}
    .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    .card{
      background:rgba(248,250,252,.94);color:#102033;border:1px solid rgba(201,169,110,.35);
      border-radius:18px;padding:18px;min-width:220px;
      box-shadow:0 22px 60px rgba(8,20,34,.28);
    }
    .card strong{display:block;margin-top:10px;font-size:.85rem;color:#0b1a28}
    .card span{display:block;margin-top:4px;font-size:.78rem;color:#5b6b7c}
  </style>
</head>
<body class="lq-atm">
  <div class="lq-atm-bg" aria-hidden="true"></div>
  <main class="stage">
    <div class="lq-brand-mark lq-brand-mark--lg">
      <img src="/assets/brand-mark-gold.png?v=beauty1" alt="جودة الانطلاقة">
    </div>
    <h1>Launch Quality</h1>
    <p class="ar">جودة الانطلاقة</p>
    <p>نفس خلفية الدخول والبوابة — الشعار الذهبي الشفاف فوق الجو الرسمي للمكان.</p>
    <div class="row">
      <div class="card">
        <div class="lq-brand-mark lq-brand-mark--md"><img src="/assets/brand-mark-gold.png?v=beauty1" alt=""></div>
        <strong>علامة الواجهة</strong>
        <span>لشاشة الدخول والبوابة</span>
      </div>
      <div class="card">
        <div class="lq-brand-mark lq-brand-mark--sm"><img src="/assets/brand-mark-gold.png?v=beauty1" alt=""></div>
        <strong>حجم صغير</strong>
        <span>للهيدر والتطبيقات</span>
      </div>
    </div>
  </main>
</body>
</html>
