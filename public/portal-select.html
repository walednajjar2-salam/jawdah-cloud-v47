<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>جودة الانطلاقة | اختيار القسم</title>
  <link rel="icon" href="/assets/app-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="lq-exec-theme.css?v=official2">
  <link rel="stylesheet" href="lq-brand-mark.css?v=beauty1">
  <link rel="stylesheet" href="lq-official-portal.css?v=official3">
</head>
<body class="lq-exec lq-official-portal">
  <div class="op-bg" aria-hidden="true"></div>
  <main class="op-stage">
    <div class="op-top" id="langMount"></div>

    <header class="op-brand">
      <div class="lq-brand-mark lq-brand-mark--lg" aria-hidden="false">
        <img src="/assets/brand-mark-gold.png?v=beauty1" alt="جودة الانطلاقة">
      </div>
      <h1 class="op-brand-name">Launch Quality</h1>
      <p class="op-brand-ar">جودة الانطلاقة</p>
      <p class="op-support" data-i18n="choosePlatformSub">منصة رسمية لإدارة العقارات والضيافة — اختر مسار عملك</p>
      <hr class="op-rule">
    </header>

    <section class="op-choices" id="portalChoices" aria-label="أقسام العمل">
      <button class="op-choice" type="button" data-enter="nizwaestate" data-portal="nizwaestate">
        <div class="op-mark" aria-hidden="true"><img src="/quick-estate/assets/logo_real_estate_transparent.png?v=nizwa3" alt=""></div>
        <h2 data-i18n="nizwaestate">عقارات نزوى</h2>
        <p data-i18n="nizwaestateDesc">وحدات وعقود نزوى — منصة مستقلة بعد الدخول</p>
        <span class="op-enter" data-i18n="enter">دخول</span>
      </button>

      <button class="op-choice" type="button" data-enter="realestate" data-portal="realestate">
        <div class="op-mark op-mark-photo" aria-hidden="true"><img src="/assets/login-portal-bg.png" alt=""></div>
        <h2 data-i18n="realestate">العقارات</h2>
        <p data-i18n="realestateDesc">الوحدات، العملاء، العقود، الفواتير، والصيانة</p>
        <span class="op-enter" data-i18n="enter">دخول</span>
      </button>

      <button class="op-choice" type="button" data-enter="hospitality" data-portal="hospitality">
        <div class="op-mark" aria-hidden="true"><span>ض</span></div>
        <h2 data-i18n="hospitality">الضيافة</h2>
        <p data-i18n="hospitalityDesc">المجالس، الحجوزات، الخدمات، والمخزن</p>
        <span class="op-enter" data-i18n="enter">دخول</span>
      </button>

      <button class="op-choice" type="button" data-enter="products" data-portal="products">
        <div class="op-mark" aria-hidden="true"><span>م</span></div>
        <h2 data-i18n="products">منتجاتنا</h2>
        <p data-i18n="productsDesc">المنتجات، الأسعار، المخزون، والمبيعات</p>
        <span class="op-enter" data-i18n="enter">دخول</span>
      </button>

      <button class="op-choice" type="button" data-enter="overview" data-portal="overview">
        <div class="op-mark" aria-hidden="true"><span>ن</span></div>
        <h2 data-i18n="overview">نظرة شاملة</h2>
        <p data-i18n="overviewDesc">مؤشرات العقارات والضيافة للإدارة</p>
        <span class="op-enter" data-i18n="enter">دخول</span>
      </button>

      <button class="op-choice finance-only" type="button" data-enter="accounting" data-portal="accounting">
        <div class="op-mark" aria-hidden="true"><span>ح</span></div>
        <h2 data-i18n="accounting">المحاسبة</h2>
        <p data-i18n="accountingDesc">الفواتير، التحصيل، القيود، والتقارير المالية</p>
        <span class="op-enter" data-i18n="enter">دخول</span>
      </button>
    </section>

    <footer class="op-foot">Launch Quality LLC · مشاريع جودة الانطلاقة للخدمات</footer>
  </main>

  <script src="lq-i18n.js?v=nizwa3"></script>
  <script>
    function readToken() {
      try {
        const qs = new URLSearchParams(location.search || "");
        const qTok = (qs.get("token") || "").trim();
        if (qTok) {
          localStorage.setItem("jawdah_cloud_token", qTok);
          qs.delete("token");
          history.replaceState({}, "", location.pathname + (qs.toString() ? "?" + qs.toString() : ""));
          return qTok;
        }
      } catch (_) {}
      try {
        const m = document.cookie.match(/(?:^|;\s*)lq_token=([^;]+)/);
        if (m && m[1]) {
          const cTok = decodeURIComponent(m[1]).trim();
          if (cTok) { localStorage.setItem("jawdah_cloud_token", cTok); return cTok; }
        }
      } catch (_) {}
      return (localStorage.getItem("jawdah_cloud_token") || "").trim();
    }

    function goLogin() {
      location.replace("/app.html?v=need-login");
    }

    function normalizePortal(choice) {
      const c = String(choice || "").toLowerCase();
      if (c === "quickestate") return "nizwaestate";
      if (["hospitality", "products", "overview", "accounting", "realestate", "nizwaestate"].includes(c)) return c;
      return "realestate";
    }

    async function enterPortal(choice) {
      const token = readToken();
      const c = normalizePortal(choice);
      localStorage.setItem("jawdah_portal_choice", c);
      if (token) localStorage.setItem("jawdah_cloud_token", token);
      if (c === "nizwaestate") {
        let qUrl = "/quick-estate.html?portal=nizwaestate&t=" + Date.now();
        if (token) qUrl += "&token=" + encodeURIComponent(token);
        location.replace(qUrl);
        return;
      }
      let url = "/app.html?fresh=20260802v706official&portal=" + encodeURIComponent(c) + "&t=" + Date.now();
      if (token) url += "&token=" + encodeURIComponent(token);
      location.replace(url);
    }

    async function detectFinanceRole() {
      const token = readToken();
      if (!token) return;
      try {
        const res = await fetch("/api/me", { headers: { Authorization: "Bearer " + token } });
        const data = await res.json();
        const role = String(data.user?.role || data.role || "").toLowerCase();
        const uname = String(data.user?.username || "").toLowerCase();
        if (role === "accountant" || ["razan", "waleed", "yaqoub", "owner", "ahmed", "ahmed.najjar", "waleed.najjar"].includes(uname)) {
          document.body.classList.add("show-finance");
        }
      } catch (_) {}
    }

    (function boot() {
      const token = readToken();
      if (!token) return goLogin();
      document.getElementById("langMount").innerHTML = window.LQ_I18N.langSwitcherHtml("portalLang");
      window.LQ_I18N.bindSwitcher("portalLang");
      window.LQ_I18N.applyDocument();
      document.querySelectorAll("[data-enter]").forEach((btn) => {
        btn.addEventListener("click", () => enterPortal(btn.getAttribute("data-enter")));
      });
      detectFinanceRole();
      document.addEventListener("lq:langchange", () => window.LQ_I18N.applyDocument());
    })();
  </script>
</body>
</html>
